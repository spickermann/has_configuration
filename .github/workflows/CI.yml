name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Resolve the latest available patch of every supported Ruby series.
        ruby: ['3.3', '3.4', '4.0']
        rails: ['', '8.0', '8.1']
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails || 'none' }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ matrix.rails && format('gemfiles/rails_{0}.gemfile', matrix.rails) || 'Gemfile' }}
      BUNDLE_FROZEN: 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby and Install Gems
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Tests and Standard
        run: bundle exec rake
      - name: Build and Verify Isolated Package
        if: matrix.rails == ''
        run: bundle exec ruby script/verify_package.rb
      - name: Codacy Coverage
        if: matrix.ruby == '4.0' && matrix.rails == ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
