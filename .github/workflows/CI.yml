name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        rails: ['', '8.0', '8.1']
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails || 'none' }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Ruby and Install Gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Tests and Standard
        run: bundle exec rake
      - name: Build and Verify Isolated Package
        if: matrix.rails == ''
        run: bundle exec ruby script/verify_package.rb
      - name: Codacy Coverage
        if: matrix.ruby == '4.0' && matrix.rails == ''
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
