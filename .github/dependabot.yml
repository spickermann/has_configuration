version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
